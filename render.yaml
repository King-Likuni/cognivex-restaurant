# Render Blueprint for the Cognivex backend.
#
# Use this for the API only. Keep PostgreSQL on Neon for the zero-budget path,
# then paste the Neon pooled connection string into DATABASE_URL in Render.

services:
  - type: web
    name: cognivex-restaurant-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: VERSION
        value: 0.1.0
      - key: postgresql://neondb_owner:npg_QSWaDT7OKG3d@ep-curly-moon-ayniw57h-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
        sync: false
      - key: REDIS_URL
        value: ""
      - key: I3aDx9CB3R0TI6iN4EJoyoC_WkjV2IVbPbhRXxYY0CkGxLtL-ivyN94IuyC9b-3d
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: goynfl46OzWWUpEqClhrKgzTwOMnHnZQbIzw6pzvUcCfkVCww7qwTrZVMN-YI5U0
        sync: false
      - key: gw73FeS7E5sgdqIsCiH0VSk3Jv4BpPdr
        sync: false
      - key: BV9LCuYJLNCdskL-zxijt-8yYt85L7g3idoUn7ik9SLmQsjga2eW3a1jp550hNiA
