# Render Blueprint for the Cognivex backend.
#
# Use this for the API only. Keep PostgreSQL on Neon for the zero-budget path,
# then paste the Neon pooled connection string into DATABASE_URL in Render.

services:
  - type: web
    name: cognivex-restaurant-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: VERSION
        value: 0.1.0
