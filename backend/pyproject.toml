[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts", "alembic"]
exclude = [
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "venv",
    ".venv",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI intentionally uses Depends(...) in function defaults.
    "E501",  # Formatting owns wrapping; some URLs/messages should stay intact.
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
